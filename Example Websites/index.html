<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="KCRSN archive merch. Hoodie, tee, vinyl.">
  <title>KCRSN // ARCHIVE</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="crt-noise" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>

  <header class="site-header shell">
    <a class="wordmark" href="#top" aria-label="Archive home">KCRSN<span>//</span>ARCHIVE</a>
    <nav aria-label="Main navigation"><a href="#drop">01</a><a href="#lookbook">02</a><a href="#about">03</a></nav>
    <button class="cart-button" id="cart-button" aria-label="Open shopping bag">Bag <span
        id="cart-count">0</span></button>
  </header>

  <main id="top">
    <section class="hero shell">
      <div class="hero-screen">
        <div class="hero-photo">
          <div class="ken-photo" role="img" aria-label="Ken Carson portrait"></div>
        </div>
        <div class="hero-glitch" aria-hidden="true">KCRSN</div>
        <span class="cross-mark" aria-hidden="true">†</span>
        <div class="hero-copy">
          <p class="eyebrow">DROP 01 / 2026</p>
          <h1><em>KCRSN</em><br>ARCHIVE</h1>
          <a class="enter-button" href="#drop">Enter <span>↗</span></a>
        </div>
        <div class="screen-meta"><span>CH. 013</span><span>NO SIGNAL / ALL FEELING</span><span>00:13:37</span></div>
        <div class="tv-static" aria-hidden="true"></div>
      </div>
    </section>

    <section class="ticker" aria-label="Drop announcement">
      <div class="ticker-track"><span>KCRSN</span><b>✦</b><span>ARCHIVE</span><b>✦</b><span>DROP
          01</span><b>✦</b><span>LIMITED RUN</span><b>✦</b><span>KCRSN</span><b>✦</b><span>ARCHIVE</span><b>✦</b></div>
    </section>

    <section class="drop shell" id="drop">
      <div class="section-heading">
        <p class="eyebrow">01 / drop</p>
        <h2><em>01</em></h2>
      </div>
      <div class="product-grid">
        <article class="product-card product-hoodie">
          <div class="product-photo"><span class="product-number">001</span><button class="quick-view"
              aria-label="View hoodie">+</button></div>
          <div class="product-info">
            <div>
              <h3>Hoodie</h3>
            </div><strong>$120</strong>
          </div>
          <button class="add-button" data-product="Hoodie">Add to bag <span>+</span></button>
        </article>
        <article class="product-card product-tee">
          <div class="product-photo"><span class="product-number">002</span><button class="quick-view"
              aria-label="View tee">+</button></div>
          <div class="product-info">
            <div>
              <h3>Tee</h3>
            </div><strong>$55</strong>
          </div>
          <button class="add-button" data-product="Tee">Add to bag <span>+</span></button>
        </article>
        <article class="product-card product-vinyl">
          <div class="product-photo"><span class="product-number">003</span><button class="quick-view"
              aria-label="View vinyl">+</button></div>
          <div class="product-info">
            <div>
              <h3>Vinyl</h3>
            </div><strong>$40</strong>
          </div>
          <button class="add-button" data-product="Vinyl">Add to bag <span>+</span></button>
        </article>
      </div>
    </section>

    <section class="lookbook shell" id="lookbook">
      <div class="lookbook-static lookbook-one" aria-hidden="true"></div>
      <div class="lookbook-copy">
        <p class="eyebrow">02 / visual</p>
        <h2><em>02</em></h2>
        <a class="text-link" href="#drop">Shop <span>↓</span></a>
      </div>
      <div class="lookbook-static lookbook-two" aria-hidden="true"></div>
    </section>

    <section class="about shell" id="about">
      <div>
        <p class="eyebrow">03 / archive</p>
        <h2><em>03</em></h2>
      </div>
    </section>
  </main>

  <footer class="site-footer shell"><span>KCRSN // ARCHIVE</span><span>DROP 01 / 2026</span></footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const cartCount = document.querySelector('#cart-count');
    const toast = document.querySelector('#toast');
    let cartTotal = 0;
    document.querySelectorAll('.add-button').forEach((button) => button.addEventListener('click', () => {
      cartTotal += 1;
      cartCount.textContent = cartTotal;
      toast.textContent = `${button.dataset.product} added to bag`;
      toast.classList.add('is-visible');
      window.setTimeout(() => toast.classList.remove('is-visible'), 2200);
      button.innerHTML = 'Added <span>✓</span>';
      window.setTimeout(() => { button.innerHTML = 'Add to bag <span>+</span>'; }, 1500);
    }));
    document.querySelectorAll('.quick-view').forEach((button) => button.addEventListener('click', () => {
      toast.textContent = 'Full details dropping soon';
      toast.classList.add('is-visible');
      window.setTimeout(() => toast.classList.remove('is-visible'), 2200);
    }));
  </script>
</body>

</html>
