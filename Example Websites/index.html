<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A simple two-player game scorekeeper.">
  <title>Game Scorekeeper</title>
  <style>
    :root {
      color-scheme: dark;
      --navy-950: #071426;
      --navy-900: #0d2038;
      --navy-800: #153452;
      --blue-400: #75b8e8;
      --blue-200: #c6e4f7;
      --white: #f4f8fc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 1.5rem;
      color: var(--white);
      background: radial-gradient(circle at top, #17395a 0, var(--navy-950) 52%);
      font-family: Georgia, "Times New Roman", serif;
    }

    .scorekeeper {
      width: min(100%, 45rem);
      padding: clamp(2rem, 6vw, 4rem);
      border: 1px solid rgba(198, 228, 247, 0.18);
      border-radius: 1rem;
      background: rgba(13, 32, 56, 0.9);
      box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, 0.28);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 0.75rem;
      color: var(--blue-400);
      font-family: "Trebuchet MS", sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 2.5rem;
      font-size: clamp(2.25rem, 7vw, 4rem);
      font-weight: 400;
    }

    .players {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
    }

    .player {
      padding: 1.5rem 1rem;
      border: 1px solid rgba(198, 228, 247, 0.16);
      border-radius: 0.75rem;
      background: rgba(7, 20, 38, 0.55);
    }

    h2 {
      margin: 0;
      color: var(--blue-200);
      font-size: clamp(1.25rem, 4vw, 1.75rem);
      font-weight: 400;
    }

    .score {
      margin: 0.5rem 0 1.25rem;
      font-family: "Trebuchet MS", sans-serif;
      font-size: clamp(4rem, 12vw, 6rem);
      font-weight: 700;
      line-height: 1;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 0.6rem;
    }

    button {
      min-width: 4.25rem;
      padding: 0.7rem 0.85rem;
      border: 1px solid var(--blue-400);
      border-radius: 0.4rem;
      color: var(--white);
      background: var(--navy-800);
      font: 700 0.9rem "Trebuchet MS", sans-serif;
      cursor: pointer;
    }

    button:hover,
    button:focus-visible {
      background: #1d4a70;
    }

    button:focus-visible {
      outline: 3px solid var(--blue-200);
      outline-offset: 3px;
    }

    @media (max-width: 30rem) {
      .players {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="scorekeeper" aria-labelledby="page-title">
    <p class="eyebrow">Match day</p>
    <h1 id="page-title">Game Scorekeeper</h1>
    <section class="players" aria-label="Player scores">
      <article class="player">
        <h2>Player One</h2>
        <p class="score" id="score-one" aria-live="polite">0</p>
        <div class="controls">
          <button type="button" data-player="one" data-change="1">+1</button>
          <button type="button" data-player="one" data-change="-1">-1</button>
        </div>
      </article>
      <article class="player">
        <h2>Player Two</h2>
        <p class="score" id="score-two" aria-live="polite">0</p>
        <div class="controls">
          <button type="button" data-player="two" data-change="1">+1</button>
          <button type="button" data-player="two" data-change="-1">-1</button>
        </div>
      </article>
    </section>
  </main>
  <script>
    const scores = { one: 0, two: 0 };

    document.querySelectorAll('button[data-player]').forEach((button) => {
      button.addEventListener('click', () => {
        const player = button.dataset.player;
        scores[player] += Number(button.dataset.change);
        document.querySelector(`#score-${player}`).textContent = scores[player];
      });
    });
  </script>
</body>

</html>
